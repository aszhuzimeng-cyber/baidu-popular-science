    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <header class="site-header">
      <p>DESIGNED &amp; BUILT BY <strong>朱子萌</strong></p>
      <span class="header-note">2026</span>

    <main>
      <section class="works" id="works" aria-label="作品列表">
        <article class="project-card reveal">
          <a class="project-link" href="./shadow-story/" aria-label="体验数字皮影交互系统">
            <div class="project-visual">
              <img
                class="project-cover"
                src="./assets/covers/shadow-story-cover.png"
                alt="数字皮影交互系统运行界面"
              />
              <span class="project-index">01</span>
            </div>
            <div class="project-body">
              <p class="project-type">数字文化</p>
              <h2>数字皮影交互系统</h2>
              <p class="project-summary">
                从拼装角色、布置场景到操控演出，把皮影创作流程转化为完整的数字互动体验。
              </p>
              <span class="launch-chip">进入体验 <span aria-hidden="true">→</span></span>

          </a>

        <article class="project-card reveal">
          <a class="project-link" href="./amblyopia/" aria-label="体验儿童弱视机制互动科普">
            <div class="project-visual">
              <img
                class="project-cover"
                src="./assets/covers/amblyopia-cover.png"
                alt="儿童弱视机制互动科普运行界面"
              />
              <span class="project-index">02</span>
            </div>
            <div class="project-body">
              <p class="project-type">交互科普</p>
              <h2>儿童弱视机制互动科普</h2>
              <p class="project-summary">
                通过双眼画面对比、时间变化与空间操作，把抽象的弱视形成过程变成可观察、可理解的沉浸式体验。
              </p>
              <span class="launch-chip">进入体验 <span aria-hidden="true">→</span></span>
            </div>
          </a>
        </article>
      </section>
